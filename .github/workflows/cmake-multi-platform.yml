# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      contents: read

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Four toolchains - MSVC on Windows, gcc and clang on Linux, clang on macOS - each in both build
      # types. Debug is not redundant: it is where assert() and the standard library's debug checks are
      # live, so a Release-only matrix never runs the invariant checks the code is written against.
      matrix:
        os: [ 'ubuntu-22.04', windows-latest, macos-latest ]
        build_type: [ Release, Debug ]
        c_compiler: [ gcc, clang, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: 'ubuntu-22.04'
            c_compiler: gcc
            cpp_compiler: g++
          - os: 'ubuntu-22.04'
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: 'ubuntu-22.04'
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v6

      - name: Set reusable strings
        # Only configure presets exist; build and test go through the binary directory the preset pins.
        # Derive both names once here from the matrix build type rather than repeating the mapping.
        # Also exports DOTNET_CLI_HOME/NUGET_PACKAGES for every later step: `runner.temp` isn't in the
        # context available to job-level `env:` (only `github, needs, strategy, matrix, vars, secrets,
        # inputs` - see the Actions context-availability table), so it has to be resolved here, inside a
        # step, and forwarded to the rest of the job through $GITHUB_ENV instead.
        id: strings
        shell: bash
        run: |
          lower=$(echo '${{ matrix.build_type }}' | tr '[:upper:]' '[:lower:]')
          echo "preset=ecs3d-$lower" >> "$GITHUB_OUTPUT"
          echo "build_dir=cmake-build-ecs3d-$lower" >> "$GITHUB_OUTPUT"
          echo "DOTNET_CLI_HOME=${{ runner.temp }}/dotnet-cli-home" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=${{ runner.temp }}/nuget-packages" >> "$GITHUB_ENV"

      - name: Install dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev ninja-build

      - name: Install Ninja (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: choco install ninja

      - name: Set up MSVC environment (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Vulkan SDK
        uses: humbletim/install-vulkan-sdk@main
        with:
          version: 1.4.309.0
          cache: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Clear stale dotnet shared-memory state (macOS)
        # The macOS runner image ships a pre-warmed dotnet install, and its /tmp/.dotnet/shm session
        # directory was created under the image-builder's session, not this job's. .NET's named-mutex
        # implementation hardcodes its shared-memory backing store to /tmp/ regardless of
        # DOTNET_CLI_HOME/HOME (see SharedMemoryManager.Unix.cs), so a session id collision or
        # leftover restrictive permissions there make Mutex construction for "NuGet-Migrations" throw
        # `IOException: The system cannot open the device or file specified` intermittently - this is
        # the exact crash and root cause tracked in
        # https://github.com/dotnet/runtime/issues/91987, fixed at the runtime level by
        # https://github.com/dotnet/runtime/pull/90343 (7.0) and
        # https://github.com/dotnet/runtime/pull/90344 (6.0), whose own PR notes list deleting these
        # directories as the workaround when the fix isn't present. Deleting them here forces a fresh,
        # correctly-permissioned session directory to be created under this job's own user.
        if: ${{ matrix.os == 'macos-latest' }}
        run: sudo rm -rf /tmp/.dotnet/shm /tmp/.dotnet/lockfiles

      - name: Warm up dotnet first-run setup
        # The first `dotnet` invocation that actually resolves the SDK (build/publish/restore, unlike
        # the --version/--list-runtimes probes FindDotnet.cmake runs at configure time) performs
        # one-time NuGet migration work guarded by a machine-wide named mutex. The build later runs the
        # ScriptBridge and ECS3DNetTransport `dotnet publish` custom targets in parallel, and two
        # processes racing through that first-run setup can crash it (e.g. the mutex's backing
        # directory under /tmp/.dotnet/shm not existing yet on one side of the race). Run one real
        # command here, serially, so first-run setup is done before the parallel publishes start.
        run: dotnet nuget locals all --list

      - name: Configure CMake
        # Through the configure preset, so that CMakePresets.json is exercised by CI rather than
        # described by it: the generator, the build directory and the build type all come from the file
        # a developer uses. Only the compilers are passed here, because they are the one thing the
        # matrix varies and the preset deliberately does not pin.
        run: >
          cmake --preset ${{ steps.strings.outputs.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build_dir }}

      - name: Test
        # Run the suite through the check target rather than ctest directly, so CI exercises the target
        # developers use - its --test-dir scoping and its config handling included. A defect in check
        # otherwise lands on main green, which is how a broken generator expression in it got through.
        # check carries --output-on-failure and --no-tests=error, the latter being what makes a suite
        # that registers nothing fail instead of pass.
        run: cmake --build ${{ steps.strings.outputs.build_dir }} --target check