# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Four toolchains - MSVC on Windows, gcc and clang on Linux, clang on macOS - each in both build
      # types. Debug is not redundant: it is where assert() and the standard library's debug checks are
      # live, so a Release-only matrix never runs the invariant checks the code is written against.
      matrix:
        os: [ 'ubuntu-22.04', windows-latest, macos-latest ]
        build_type: [ Release, Debug ]
        c_compiler: [ gcc, clang, cl ]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: 'ubuntu-22.04'
            c_compiler: gcc
            cpp_compiler: g++
          - os: 'ubuntu-22.04'
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: 'ubuntu-22.04'
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v6

      - name: Set reusable strings
        # The presets are named in lower case and the matrix build types are not, so derive the preset
        # name once here rather than spelling the mapping out at every step that needs it.
        id: strings
        shell: bash
        run: |
          echo "preset=$(echo '${{ matrix.build_type }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (Ubuntu)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev ninja-build

      - name: Install Ninja (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: choco install ninja

      - name: Set up MSVC environment (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Prepare Vulkan SDK
        uses: humbletim/install-vulkan-sdk@main
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure CMake
        # Through the preset, so that CMakePresets.json is exercised by CI rather than described by it:
        # the generator, the build directory and the build type all come from the file a developer uses.
        # Only the compilers are passed here, because they are the one thing the matrix varies and the
        # presets deliberately do not pin.
        run: >
          cmake --preset ${{ steps.strings.outputs.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}

      - name: Build
        run: cmake --build --preset ${{ steps.strings.outputs.preset }}

      - name: Test
        # Run the suite through the check target rather than ctest directly, so CI exercises the target
        # developers use - its --test-dir scoping and its config handling included. A defect in check
        # otherwise lands on main green, which is how a broken generator expression in it got through.
        # The suite is already built by the step above, so this only runs it. check passes
        # --no-tests=error, which is what makes a suite that registers nothing fail instead of pass.
        run: cmake --build --preset ${{ steps.strings.outputs.preset }}-check